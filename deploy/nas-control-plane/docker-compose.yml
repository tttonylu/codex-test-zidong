version: "3.8"

services:
  nas_control_plane:
    build:
      context: ../..
      dockerfile: nas_control_plane/Dockerfile
    container_name: ${XMATRIX_NAS_CONTAINER_NAME}
    environment:
      TZ: Asia/Shanghai
      XMATRIX_NAS_HOST: 0.0.0.0
      XMATRIX_NAS_PORT: 8765
      XMATRIX_NAS_STATE_PATH: ${XMATRIX_NAS_STATE_FILE}
      XMATRIX_DEPLOYMENT_FLAVOR: fnos-docker
      XMATRIX_DEPLOYMENT_MARKER: ${XMATRIX_DEPLOYMENT_MARKER}
    ports:
      - "${XMATRIX_NAS_PORT}:8765"
    volumes:
      - "${XMATRIX_NAS_STATE_DIR}:/data"
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8765/healthz', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
